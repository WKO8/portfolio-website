<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="analisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="trendGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="analisGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#analisBg)" />
  <rect width="188" height="188" x="2" y="2" rx="40" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.25" />

  <!-- Data Grid Lines -->
  <line x1="40" y1="140" x2="152" y2="140" stroke="#334155" stroke-width="2" stroke-linecap="round" />
  <line x1="40" y1="105" x2="152" y2="105" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="40" y1="70" x2="152" y2="70" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Data Bars -->
  <rect x="48" y="100" width="16" height="40" rx="4" fill="url(#barGrad)" opacity="0.85" />
  <rect x="74" y="80" width="16" height="60" rx="4" fill="url(#barGrad)" opacity="0.9" />
  <rect x="100" y="60" width="16" height="80" rx="4" fill="url(#barGrad)" />
  <rect x="126" y="42" width="16" height="98" rx="4" fill="url(#barGrad)" filter="url(#analisGlow)" />

  <!-- Predictive Trendline & AI Nodes -->
  <path d="M52 95 Q 82 85 106 55 T 152 38" fill="none" stroke="url(#trendGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#analisGlow)" />
  
  <circle cx="56" cy="94" r="4" fill="#38bdf8" />
  <circle cx="82" cy="74" r="4" fill="#38bdf8" />
  <circle cx="108" cy="55" r="5" fill="#a855f7" filter="url(#analisGlow)" />
  <circle cx="152" cy="38" r="6" fill="#c084fc" filter="url(#analisGlow)" />
</svg>
