<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="unhearBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041f1a" />
      <stop offset="100%" stop-color="#020d0b" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#20C20E" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="soundGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#unhearBg)" />
  <rect width="188" height="188" x="2" y="2" rx="40" fill="none" stroke="#20C20E" stroke-width="2" stroke-opacity="0.3" />

  <!-- DSP Audio Waveform Vertical Bars -->
  <rect x="34" y="86" width="6" height="20" rx="3" fill="#10b981" opacity="0.6" />
  <rect x="46" y="74" width="6" height="44" rx="3" fill="#10b981" opacity="0.75" />
  <rect x="58" y="58" width="6" height="76" rx="3" fill="#20C20E" opacity="0.9" />
  <rect x="70" y="44" width="6" height="104" rx="3" fill="#20C20E" filter="url(#soundGlow)" />
  <rect x="82" y="66" width="6" height="60" rx="3" fill="#20C20E" />
  <rect x="94" y="36" width="6" height="120" rx="3" fill="#34d399" filter="url(#soundGlow)" />
  <rect x="106" y="62" width="6" height="68" rx="3" fill="#20C20E" />
  <rect x="118" y="48" width="6" height="96" rx="3" fill="#06b6d4" filter="url(#soundGlow)" />
  <rect x="130" y="68" width="6" height="56" rx="3" fill="#06b6d4" opacity="0.85" />
  <rect x="142" y="78" width="6" height="36" rx="3" fill="#06b6d4" opacity="0.7" />
  <rect x="154" y="88" width="6" height="16" rx="3" fill="#06b6d4" opacity="0.5" />

  <!-- Continuous Frequency Sine Line -->
  <path d="M30 96 Q 58 40 82 96 T 130 96 T 162 96" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5" />
</svg>
