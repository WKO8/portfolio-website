<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a12" />
      <stop offset="100%" stop-color="#040b08" />
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#20C20E" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20C20E" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shortsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="192" height="192" rx="42" fill="url(#pipeBg)" />
  <rect width="188" height="188" x="2" y="2" rx="40" fill="none" stroke="#20C20E" stroke-width="2" stroke-opacity="0.25" />

  <!-- Vertical 9:16 Shorts Mobile Screen Frame -->
  <rect x="62" y="34" width="68" height="124" rx="14" fill="#06120b" stroke="url(#frameGrad)" stroke-width="2.5" />
  
  <!-- Speaker Face Detection Box (Active Speaker Detection / YuNet hint) -->
  <rect x="76" y="52" width="40" height="40" rx="8" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.85" />
  <!-- Speaker head icon inside detection box -->
  <circle cx="96" cy="67" r="8" fill="#38bdf8" opacity="0.75" />
  <path d="M84 86 C84 78 108 78 108 86" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.75" />

  <!-- Waveform / Audio Subtitles Phonetics Sync -->
  <rect x="74" y="104" width="3" height="12" rx="1.5" fill="#20C20E" />
  <rect x="80" y="99" width="3" height="22" rx="1.5" fill="#20C20E" filter="url(#shortsGlow)" />
  <rect x="86" y="103" width="3" height="14" rx="1.5" fill="#20C20E" />
  <rect x="92" y="96" width="3" height="28" rx="1.5" fill="#34d399" filter="url(#shortsGlow)" />
  <rect x="98" y="101" width="3" height="18" rx="1.5" fill="#20C20E" />
  <rect x="104" y="97" width="3" height="26" rx="1.5" fill="#20C20E" filter="url(#shortsGlow)" />
  <rect x="110" y="103" width="3" height="14" rx="1.5" fill="#20C20E" />
  <rect x="116" y="106" width="3" height="8" rx="1.5" fill="#20C20E" />

  <!-- Play indicator / Cut Marker -->
  <polygon points="91,134 105,142 91,150" fill="url(#glowGrad)" filter="url(#shortsGlow)" />

  <!-- Lateral Timeline Markers indicating Autonomous Pipeline Cuts -->
  <line x1="42" y1="96" x2="56" y2="96" stroke="#20C20E" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <polygon points="54,93 59,96 54,99" fill="#20C20E" opacity="0.8" />
  
  <line x1="136" y1="96" x2="150" y2="96" stroke="#20C20E" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <polygon points="138,93 133,96 138,99" fill="#20C20E" opacity="0.8" />
</svg>
