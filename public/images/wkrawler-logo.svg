<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="krawlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091426" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="graphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="krawlGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#krawlBg)" />
  <rect width="188" height="188" x="2" y="2" rx="40" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.3" />

  <!-- Radar / Threat Scan circles -->
  <circle cx="96" cy="96" r="62" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4" />
  <circle cx="96" cy="96" r="38" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Graph Edges / OSINT Web -->
  <line x1="96" y1="96" x2="52" y2="62" stroke="#0284c7" stroke-width="2" opacity="0.7" />
  <line x1="96" y1="96" x2="140" y2="62" stroke="#0284c7" stroke-width="2" opacity="0.7" />
  <line x1="96" y1="96" x2="48" y2="128" stroke="#0284c7" stroke-width="2" opacity="0.7" />
  <line x1="96" y1="96" x2="144" y2="128" stroke="#0284c7" stroke-width="2" opacity="0.7" />
  <line x1="52" y1="62" x2="140" y2="62" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5" />
  <line x1="48" y1="128" x2="144" y2="128" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5" />
  <line x1="96" y1="96" x2="96" y2="40" stroke="#0ea5e9" stroke-width="2" opacity="0.8" />
  <line x1="96" y1="96" x2="96" y2="152" stroke="#0ea5e9" stroke-width="2" opacity="0.8" />

  <!-- Graph Nodes -->
  <circle cx="52" cy="62" r="7" fill="#38bdf8" />
  <circle cx="140" cy="62" r="7" fill="#38bdf8" />
  <circle cx="48" cy="128" r="7" fill="#38bdf8" />
  <circle cx="144" cy="128" r="7" fill="#38bdf8" />
  <circle cx="96" cy="40" r="5" fill="#22d3ee" />
  <circle cx="96" cy="152" r="5" fill="#22d3ee" />

  <!-- Central Intelligence Target Node -->
  <circle cx="96" cy="96" r="14" fill="#0f172a" stroke="url(#graphGrad)" stroke-width="3.5" filter="url(#krawlGlow)" />
  <circle cx="96" cy="96" r="5" fill="#20C20E" filter="url(#krawlGlow)" />
</svg>
